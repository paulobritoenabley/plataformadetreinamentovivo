<style>
/* Vídeo para o cliente (/video/, pública): um vídeo do catálogo (tabela videos), tocado no player do Google Drive dentro da página.
   O link do GN é /video/#v=<código>&gn=Nome&w=55DDDNUMERO&c=Empresa&e=<código do envio>; a página busca o vídeo em /api/videos?v=
   (só vídeo marcado para o cliente). Exceção aprovada em 02/11/2026: o quadro do Drive é de fora e não avisa play, pausa nem avanço;
   o que se mede é o clique dentro do vídeo e o tempo com a página à vista depois dele (estimativa).
   Marca Vivo (Guia 2023): mesmos tokens da jornada, abre no claro; o escuro só pelo botão. */
:root{
  --purpura:#660099; --rosa:#EB3C7D; --lilas:#BD4AFF; --rose:#FF96B2; --roxo:#380054; --magenta:#CC3D70;
  --font:"Vivo Type","Trebuchet MS",sans-serif;

  --bg:#F8F4FB; --surface:#FFFFFF; --surface-2:#F1E9F7; --fg:#22102E; --fg-soft:#5B4868;
  --line:rgba(56,0,84,.13); --line-strong:rgba(56,0,84,.28);
  --accent:#660099; --etiq:#CC3D70; --marca:#660099;
  --btn:#660099; --btn-fg:#FFFFFF; --btn-hover:#3D005C;
  --shadow:0 18px 40px -24px rgba(56,0,84,.6);
}
:root[data-theme="dark"]{
  --bg:#170722; --surface:#220E33; --surface-2:#2C1442; --fg:#F7EFFC; --fg-soft:#CDB9DB;
  --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.28);
  --accent:#FF96B2; --etiq:#FF96B2; --marca:#FFFFFF;
  --btn:#FF96B2; --btn-fg:#380054; --btn-hover:#FFC0D1;
  --shadow:0 18px 40px -24px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
h1,h2{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rosa);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px),4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw)}

/* ---------- Cabeçalho ---------- */
.topo{display:flex;align-items:center;gap:14px;padding-block:14px;background:var(--surface);border-bottom:1px solid var(--line)}
.marca{display:flex;align-items:center;gap:12px;color:var(--marca);text-decoration:none;min-width:0}
.marca svg{height:28px;width:auto;display:block;flex:0 0 auto}
.marca-sep{width:1px;height:24px;background:var(--line-strong);flex:0 0 auto}
.marca-t{display:grid;line-height:1.2;color:var(--fg)}
.marca-t b{font-size:.95rem}
.marca-t small{font-size:.78rem;color:var(--fg-soft)}
.para-empresa{margin-left:auto;min-width:0;font-size:.85rem;color:var(--fg-soft);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.para-empresa b{color:var(--fg)}
.para-empresa:not([hidden]) + .tema{margin-left:0}
.tema{margin-left:auto;flex:0 0 auto;width:40px;height:40px;border-radius:4px;border:1.5px solid var(--line-strong);background:transparent;color:var(--fg);display:inline-grid;place-items:center;cursor:pointer;padding:0}
.tema:hover{background:var(--surface-2)}
.tema svg{width:20px;height:20px}
.tema .sol{display:none}
.tema[aria-pressed="true"] .sol{display:block}
.tema[aria-pressed="true"] .lua{display:none}
.fibra{height:4px;background:linear-gradient(90deg,var(--purpura),var(--rosa))}
@media (max-width:560px){.marca-t small{display:none}.marca-sep{display:none}.marca-t b{font-size:.85rem;white-space:nowrap}.marca{flex:0 0 auto}}

/* ---------- Vídeo ---------- */
.palco{flex:1;width:100%;max-width:1040px;margin:0 auto;padding-block:28px 40px;display:grid;gap:22px;align-content:start}
.etiq{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--etiq)}
.cab{display:grid;gap:8px}
.cab h1{font-size:clamp(1.5rem,3.4vw,2.2rem);color:var(--accent)}
.cab .desc{color:var(--fg-soft);max-width:62ch}
.cab .meta{font-size:.85rem;color:var(--fg-soft)}
.player{position:relative;aspect-ratio:16/9;background:#1B0627;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
@supports not (aspect-ratio:16/9){.player{height:0;padding-top:56.25%}}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
/* vídeo em pé (9:16): no desktop, o player à esquerda e o texto ao lado; no celular, um embaixo do outro */
.palco.em-pe{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"player cab" "player chamada" "player .";column-gap:clamp(20px,4vw,48px)}
.palco.em-pe .cab{grid-area:cab;align-self:end}
.palco.em-pe .chamada{grid-area:chamada}
.palco.em-pe .player{grid-area:player;aspect-ratio:9/16;width:min(380px,calc((100vh - 150px) * 9 / 16));min-width:240px}
@supports not (aspect-ratio:9/16){.palco.em-pe .player{height:0;padding-top:177.78%}}
@media (max-width:760px){
  .palco.em-pe{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"cab" "player" "chamada"}
  .palco.em-pe .player{justify-self:center;width:min(100%,calc((100vh - 120px) * 9 / 16));min-width:0}
}
/* cobre o botão do Drive que abre o vídeo fora da página (lá aparece a conta dona do arquivo) */
.player .tampa{position:absolute;top:0;right:0;width:76px;height:64px;z-index:2}
.carregando{position:absolute;inset:0;display:grid;place-items:center;color:#CDB9DB;font-size:.95rem}
.carregando span{display:inline-flex;align-items:center;gap:10px}
.carregando span::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#FF96B2;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.erro{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--rosa);border-radius:8px;padding:18px 20px}
.erro h1{font-size:1.25rem;color:var(--accent)}
.erro p{color:var(--fg-soft)}

/* ---------- Chamada final ---------- */
.chamada{display:grid;gap:12px;background:linear-gradient(120deg,var(--purpura),var(--roxo));color:#fff;border-radius:12px;padding:clamp(20px,3.4vw,32px)}
.chamada h2{font-size:clamp(1.2rem,2.6vw,1.6rem)}
.chamada p{color:#F1E9F7;max-width:60ch}
.acoes{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;padding:13px 24px;border-radius:4px;background:var(--btn);color:var(--btn-fg);border:1.5px solid var(--btn);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn-claro{background:#fff;color:#660099;border-color:#fff}
.btn-claro:hover{background:#F1E9F7;border-color:#F1E9F7}
.btn-borda{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.btn-borda:hover{background:rgba(255,255,255,.14);border-color:#fff}
.btn-chama{animation:chama 1.8s ease-out infinite}
@keyframes chama{0%{box-shadow:0 0 0 0 rgba(235,60,125,.45)}100%{box-shadow:0 0 0 14px rgba(235,60,125,0)}}
@media (max-width:560px){.acoes .btn{flex:1 1 100%}}
.aviso-rastro{margin:0;padding-block:8px 20px;font-size:.7rem;color:var(--fg-soft);opacity:.7;text-align:center}
</style>

<script>/* Rastro: o que o cliente faz na página aberta pelo link que o GN enviou (link seguro, jornada, linha de frente).
   O build embute este arquivo no marcador do rastro de cada página (comRastro, no build.js). Só liga com o código do envio (e=) no link:
   sem ele, nada é medido. Mede abertura, cliques (pelo rótulo do botão, nunca o que foi digitado), até onde rolou,
   tempo na página e o contato pelo WhatsApp; cada página pode mandar eventos próprios (ex.: etapa da jornada).
   Envia em lotes para /api/visita do próprio site, sem guardar nada além do id da visita na aba. Script ES5. */
var Rastro = (function(){
  var CODIGO = /^[A-Za-z0-9]{8,24}$/, LETRAS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  var envio = '', sessao = '', fila = [], timer = null, inicio = 0, maxRolagem = 0, marcos = [25, 50, 75, 100], saiu = false;

  function novoCodigo(n){
    var s = '', i, v = null;
    try{ v = new Uint8Array(n || 12); window.crypto.getRandomValues(v); }catch(e){ v = null; }
    for(i = 0; i < (n || 12); i++) s += LETRAS.charAt((v ? v[i] : Math.floor(Math.random() * 256)) % LETRAS.length);
    return s;
  }
  function idDaVisita(){
    var chave = 'pbvivo:visita:' + envio, id = '';
    try{ id = sessionStorage.getItem(chave) || ''; }catch(e){}
    if(!CODIGO.test(id)){ id = novoCodigo(12); try{ sessionStorage.setItem(chave, id); }catch(e){} }
    return id;
  }
  function rotulo(el){
    var t = el.getAttribute('data-rastro') || el.getAttribute('aria-label') || el.textContent || '';
    return t.replace(/\s+/g, ' ').trim().slice(0, 60);
  }
  function rolagem(){
    var d = document.documentElement, alto = Math.max(d.scrollHeight, document.body ? document.body.scrollHeight : 0) - window.innerHeight;
    return alto <= 0 ? 100 : Math.min(100, Math.round((window.pageYOffset || d.scrollTop || 0) / alto * 100));
  }

  function enviar(){
    clearTimeout(timer); timer = null;
    if(!fila.length) return;
    var agora = Date.now(), lote = fila.splice(0, 50).map(function(e){ return {tipo:e.tipo, detalhe:e.detalhe, atras:agora - e.t}; });
    var corpo = JSON.stringify({envio:envio, sessao:sessao, eventos:lote});
    try{
      if(window.fetch){ fetch('/api/visita', {method:'POST', keepalive:true, credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:corpo})['catch'](function(){}); }
      else{ var x = new XMLHttpRequest(); x.open('POST', '/api/visita', true); x.setRequestHeader('Content-Type', 'application/json'); x.send(corpo); }
    }catch(e){}
    if(fila.length) enviar();
  }
  function evento(tipo, detalhe){
    if(!envio) return;
    fila.push({tipo:tipo, detalhe:detalhe || null, t:Date.now()});
    if(fila.length >= 20) return enviar();
    if(!timer) timer = setTimeout(enviar, 5000);
  }

  function aoRolar(){
    var r = rolagem();
    if(r <= maxRolagem) return;
    maxRolagem = r;
    while(marcos.length && r >= marcos[0]) evento('rolagem', {ate:marcos.shift()});
  }
  function aoClicar(e){
    var el = e.target && e.target.closest ? e.target.closest('a,button,[data-rastro]') : null;
    if(!el || el.closest('[data-rastro-ignorar]')) return;
    var href = el.getAttribute('href') || '';
    if(/^https:\/\/(wa\.me|api\.whatsapp\.com)\//.test(href)) return evento('contato', {canal:'whatsapp', rotulo:rotulo(el)});
    evento('clique', {rotulo:rotulo(el)});
  }
  /* a cada saída (aba escondida, app trocado, página fechada) vai o tempo total e a rolagem máxima até ali */
  function aoSair(){
    if(!saiu){ evento('saiu', {rolagem:maxRolagem, segundos:Math.round((Date.now() - inicio) / 1000)}); saiu = true; }
    enviar();
  }

  function iniciar(codigo, pagina){
    if(envio || !CODIGO.test(String(codigo || ''))) return false;
    envio = String(codigo); sessao = idDaVisita(); inicio = Date.now();
    evento('abriu', {pagina:pagina || location.pathname, tela:window.innerWidth + 'x' + window.innerHeight});
    window.addEventListener('scroll', aoRolar, {passive:true});
    document.addEventListener('click', aoClicar, true);
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') aoSair(); else saiu = false; });
    window.addEventListener('pagehide', aoSair);
    setTimeout(aoRolar, 1500);
    return true;
  }

  return {iniciar:iniciar, evento:evento, novoCodigo:novoCodigo, ativo:function(){ return !!envio; }};
})();
</script>

(function(){

function h(tag, a, kids){

    else if(k.slice(0,2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v); } }
  (kids||[]).forEach(function(c){ if(c == null || c === false) return; el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
}
var store = {
  get: function(k, d){ try{ var v = localStorage.getItem('pbvivo:'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem('pbvivo:'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- Link: vídeo, contato do GN e código do envio ---------- */
/* o GN envia /video/#v=<código>&gn=Nome&w=55DDDNUMERO&c=Empresa&e=<código do envio>. Sem o próprio e= o vídeo não é medido:
   o contato guardado de outra página (pbvivo:jornadaGN) só serve para o botão final, nunca para o rastro */
function lerHash(){
  var o = {};
  (location.hash || '').replace(/^#/, '').split('&').forEach(function(par){
    var i = par.indexOf('=');
    if(i > 0){ try{ o[par.slice(0, i)] = decodeURIComponent(par.slice(i + 1)); }catch(e){} }
  });
  return o;
}
var HASH = lerHash();
var CODIGO = /^[a-z0-9]+(-[a-z0-9]+)*$/.test(HASH.v || '') && HASH.v.length <= 40 ? HASH.v : '';
var ENVIO = /^[A-Za-z0-9]{8,24}$/.test(HASH.e || '') ? HASH.e : '';
var GN = HASH.w ? {nome:String(HASH.gn || '').slice(0, 60), zap:HASH.w.replace(/\D/g, '').slice(0, 15), empresa:String(HASH.c || '').slice(0, 60)}
  : store.get('jornadaGN', null);
var VIDEO = null;

/* "Preparado para <empresa do cliente>" no topo, quando o GN preencheu */
(function(){
  var empresa = GN && GN.empresa ? String(GN.empresa).trim() : '', alvo = byId('paraEmpresa');
  if(!empresa) return;
  alvo.appendChild(document.createTextNode('Preparado para '));
  alvo.appendChild(document.createElement('b')).textContent = empresa;
  alvo.title = 'Preparado para ' + empresa;
  alvo.hidden = false;
})();

/* ---------- Medição do vídeo ----------
   O player do Drive é de outro site e não avisa nada. Quando o clique cai dentro dele, a página perde o foco para o quadro:
   é esse o "clicou" (quase sempre o play). Depois dele, conta o tempo com a página à vista e manda o total a cada saída.
   Os ouvintes entram antes do Rastro.iniciar, para o evento sair no mesmo lote do "saiu". */
var clicou = false, vistoMs = 0, desde = 0;
function tempoAteAgora(){ return vistoMs + (desde ? Date.now() - desde : 0); }
function aoFocarQuadro(){
  setTimeout(function(){
    var f = document.activeElement;
    if(!f || f.tagName !== 'IFRAME' || clicou) return;
    clicou = true; desde = Date.now();
    Rastro.evento('video', {acao:'clicou'});
  }, 0);
}
function aoEsconder(){
  if(!clicou) return;
  if(desde){ vistoMs += Date.now() - desde; desde = 0; }
  Rastro.evento('video', {acao:'tempo', segundos:Math.round(tempoAteAgora() / 1000)});
}
if(ENVIO){
  window.addEventListener('blur', aoFocarQuadro);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden') aoEsconder();
    else if(clicou && !desde) desde = Date.now();
  });
  window.addEventListener('pagehide', aoEsconder);
  Rastro.iniciar(ENVIO, 'video');
}

/* ---------- Vídeo ---------- */
function minutos(s){ var m = Math.round(s / 60); return m < 1 ? 'menos de 1 min' : m + ' min'; }
function mostra(v){
  VIDEO = v;
  document.title = v.titulo + ' · Plataforma de Treinamento Vivo Empresas';
  byId('titulo').textContent = v.titulo;
  if(v.descricao){ byId('desc').textContent = v.descricao; byId('desc').hidden = false; }
  if(v.duracao){ byId('meta').textContent = 'Duração: ' + minutos(v.duracao); byId('meta').hidden = false; }
  byId('palco').classList.toggle('em-pe', !!v.vertical);
  var p = byId('player');
  p.innerHTML = '';
  p.appendChild(h('iframe', {src:'https://drive.google.com/file/d/' + encodeURIComponent(v.drive_id) + '/preview', title:'Vídeo: ' + v.titulo,
    allow:'autoplay; fullscreen; picture-in-picture', allowfullscreen:true}));
  p.appendChild(h('div', {class:'tampa', 'aria-hidden':'true', 'data-rastro-ignorar':''}));
  chamada();
}
function semVideo(msg){
  byId('cab').hidden = true;
  var p = byId('player');
  p.parentNode.replaceChild(h('section', {class:'erro', role:'alert'}, [h('h1', {text:'Este vídeo não está disponível'}), h('p', {text:msg})]), p);
  chamada();
}
function carrega(){
  if(!CODIGO) return semVideo('O link parece incompleto. Peça um novo link a quem enviou.');
  var x = new XMLHttpRequest();
  x.open('GET', '/api/videos?v=' + encodeURIComponent(CODIGO), true);
  x.onload = function(){
    var v = null; try{ v = JSON.parse(x.responseText); }catch(e){}
    if(x.status === 200 && v && v.drive_id) return mostra(v);
    semVideo(x.status === 404 || x.status === 400 ? 'Ele pode ter saído do ar. Peça um novo link a quem enviou.' : 'Não conseguimos carregar agora. Tente de novo em instantes.');
  };
  x.onerror = function(){ semVideo('Sem conexão. Confira a internet e tente de novo.'); };
  x.send(null);
}

/* ---------- Chamada final: com o contato do GN, abre o WhatsApp dele; sem ele, leva ao diagnóstico ---------- */
function chamada(){
  var comGN = GN && GN.zap, acoes = byId('chamadaAcoes'), contato = [];
  acoes.innerHTML = '';
  if(GN && GN.nome) contato.push('gn=' + encodeURIComponent(GN.nome));
  if(comGN) contato.push('w=' + GN.zap);
  if(GN && GN.empresa) contato.push('c=' + encodeURIComponent(GN.empresa));
  var diag = 'https://paginas.plataformadetreinamentovivo.tech/descubra/' + (contato.length ? '#' + contato.join('&') : '');
  if(comGN){
    var texto = 'Olá' + (GN.nome ? ', ' + GN.nome.split(' ')[0] : '') + '! Assisti ao vídeo' + (VIDEO ? ' "' + VIDEO.titulo + '"' : '') +
      ' e quero conversar sobre treinamento na ' + (GN.empresa || 'minha empresa') + '.';
    byId('chamadaTxt').textContent = 'Fale com ' + (GN.nome || 'o seu consultor') + ' e veja como fica com os conteúdos e a operação da sua empresa.';
    acoes.appendChild(h('a', {class:'btn btn-claro btn-chama', href:'https://wa.me/' + GN.zap + '?text=' + encodeURIComponent(texto), target:'_blank', rel:'noopener',
      text:GN.nome ? 'Falar com ' + GN.nome.split(' ')[0] + ' no WhatsApp' : 'Falar com o consultor no WhatsApp'}));
    acoes.appendChild(h('a', {class:'btn btn-borda', href:diag, text:'Fazer o diagnóstico da minha operação'}));
  } else {
    byId('chamadaTxt').textContent = 'Responda 8 perguntas rápidas e veja onde a plataforma entra na sua operação, com um caso parecido com o seu.';
    acoes.appendChild(h('a', {class:'btn btn-claro', href:diag, text:'Fazer o diagnóstico'}));
  }
}

/* ---------- Tema claro / escuro: abre no claro; o escuro só se o visitante escolher ---------- */
(function(){
  var bt = byId('tema'), root = document.documentElement;
  function aplica(t){
    if(t === 'dark') root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
    bt.setAttribute('aria-pressed', String(t === 'dark'));
    bt.setAttribute('aria-label', t === 'dark' ? 'Usar tema claro' : 'Usar tema escuro');
  }
  aplica(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  bt.addEventListener('click', function(){ var t = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; store.set('tema', t); aplica(t); });
})();

/* ---------- Início ---------- */
chamada();
carrega();
})();
</script>
