<style>
/* Jornada "Como a plataforma pode ajudar": página pública em formato de jogo (/descubra/). A cada resposta, a operação do visitante
   se monta numa cena (prédios, pessoas, aparelhos) e os pontos onde o treinamento não chega aparecem apagados na Fibra.
   No fim, "Conectar a plataforma" faz a Fibra atravessar a cena e acender cada ponto. Conteúdo todo na chave "jornada" do dados.json.
   Abre sempre no tema claro (decisão de 29/10/2026); o escuro só vale se o visitante escolher no botão.
   Marca Vivo (Guia 2023): Vivo Type → Trebuchet MS, púrpura e rosa sempre presentes, botões raio 4 px, ícones em contorno
   com ponta redonda, no máximo 2 Vivinhos na tela (o do logo e o do palco). */
:root{
  --purpura:#660099; --rosa:#EB3C7D; --lilas:#BD4AFF; --rose:#FF96B2; --roxo:#380054; --magenta:#CC3D70;
  --font:"Vivo Type","Trebuchet MS",sans-serif;

  --bg:#F8F4FB; --surface:#FFFFFF; --surface-2:#F1E9F7; --fg:#22102E; --fg-soft:#5B4868;
  --line:rgba(56,0,84,.13); --line-strong:rgba(56,0,84,.28);
  --accent:#660099; --etiq:#CC3D70; --marca:#660099; --palco:#EFE4F6; --palco-on:#FBEFF6;
  --btn:#660099; --btn-fg:#FFFFFF; --btn-hover:#3D005C;
  --sel:#660099; --sel-fg:#FFFFFF;
  --cena-off:#A897B5; --cena-on:#660099; --cena-on-2:#EB3C7D; --chao:#E4D5EE; --ponto-ok:#FFFFFF;
  --shadow:0 8px 24px -18px rgba(56,0,84,.55);
}
:root[data-theme="dark"]{
  --bg:#170722; --surface:#220E33; --surface-2:#2C1442; --fg:#F7EFFC; --fg-soft:#CDB9DB;
  --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.28);
  --accent:#FF96B2; --etiq:#FF96B2; --marca:#FFFFFF; --palco:#220E33; --palco-on:#2C1442;
  --btn:#FF96B2; --btn-fg:#380054; --btn-hover:#FFC0D1;
  --sel:#BD4AFF; --sel-fg:#170722;
  --cena-off:#6E5A80; --cena-on:#FF96B2; --cena-on-2:#BD4AFF; --chao:#2C1442; --ponto-ok:#170722;
  --shadow:0 10px 28px -18px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rosa);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px),4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw)}

/* ---------- Cabeçalho ---------- */
.topo{display:flex;align-items:center;gap:14px;padding-block:14px;background:var(--surface);border-bottom:1px solid var(--line)}
.marca{display:flex;align-items:center;gap:12px;color:var(--marca);text-decoration:none;min-width:0}
.marca svg{height:28px;width:auto;display:block;flex:0 0 auto}
.marca-sep{width:1px;height:24px;background:var(--line-strong);flex:0 0 auto}
.marca-t{display:grid;line-height:1.2;color:var(--fg)}
.marca-t b{font-size:.95rem}
.marca-t small{font-size:.78rem;color:var(--fg-soft)}
.tema{margin-left:auto;flex:0 0 auto;width:40px;height:40px;border-radius:4px;border:1.5px solid var(--line-strong);background:transparent;color:var(--fg);display:inline-grid;place-items:center;cursor:pointer;padding:0}
.tema:hover{background:var(--surface-2)}
.tema svg{width:20px;height:20px}
.tema .sol{display:none}
.tema[aria-pressed="true"] .sol{display:block}
.tema[aria-pressed="true"] .lua{display:none}
.progresso{height:4px;background:var(--surface-2)}
.progresso span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purpura),var(--rosa));transition:width .45s ease}

/* ---------- Palco: Vivinho e fala ---------- */
.jogo{display:grid;gap:20px;padding-block:24px 56px;max-width:1240px;margin:0 auto}
.palco{background:var(--palco);border-radius:8px;padding:clamp(14px,2.6vw,24px);display:grid;gap:14px;align-content:start;transition:background-color 1.2s ease}
.palco.ligada{background:var(--palco-on)}
.palco-topo{display:flex;align-items:flex-end;gap:14px}
.viv{position:relative;flex:0 0 auto;width:84px;height:104px;display:grid;place-items:center}
.viv svg{position:relative;z-index:1;width:56px;height:auto;color:var(--marca)}
.pulso{position:absolute;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;border:2px solid var(--lilas);opacity:0;animation:pulso 2.8s ease-out infinite}
.pulso.p2{animation-delay:1.4s;border-color:var(--rosa)}
@keyframes pulso{0%{transform:scale(.55);opacity:.75}100%{transform:scale(1.5);opacity:0}}
.viv.forte .pulso{animation:pulso-forte 1.1s ease-out 3}
.viv.forte .pulso.p2{animation-delay:.4s}
@keyframes pulso-forte{0%{transform:scale(.6);opacity:.95}100%{transform:scale(2.7);opacity:0}}
.viv.reage svg{animation:pula .5s ease}
@keyframes pula{0%,100%{transform:none}40%{transform:translateY(-10px) rotate(-8deg)}}
.fala{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:12px 14px;font-size:1rem;line-height:1.45;box-shadow:var(--shadow);max-width:40ch}
.fala.nova{animation:surge .35s ease}
@keyframes surge{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Cena: a operação do visitante ---------- */
.cena-box{display:grid;gap:8px}
.cena{display:block;width:100%;height:auto;overflow:hidden}
.cena .chao{fill:var(--chao)}
.cena .estrada{fill:none;stroke:var(--line-strong);stroke-width:2;stroke-dasharray:10 9;stroke-linecap:round}
.cena .guia{fill:none;stroke:var(--cena-off);stroke-width:1.6;stroke-dasharray:2 6;stroke-linecap:round;transition:opacity .8s ease}
.cena .fibra{fill:none;stroke:var(--rosa);stroke-width:3.2;stroke-linecap:round}
.cena.ligada .guia{opacity:0}
.cena .el{color:var(--cena-off);fill:var(--surface);transition:color .6s ease var(--d,0ms)}
.cena.ligada .el{color:var(--cena-on)}
.cena.ligada .el.alt{color:var(--cena-on-2)}
.cena .novo{animation:brota .55s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes brota{from{opacity:0;transform:translateY(10px) scale(.5)}to{opacity:1;transform:none}}
.cena .anda{animation:anda 11s linear infinite}
@keyframes anda{from{transform:translateX(-60px)}to{transform:translateX(440px)}}
.cena .chega{animation:chega 5s ease-in-out infinite}
@keyframes chega{0%{transform:translateX(0);opacity:0}15%{opacity:1}75%{transform:translateX(34px);opacity:1}90%,100%{transform:translateX(34px);opacity:0}}
.ponto{transition:transform .5s ease}
.ponto-in{transform-box:fill-box;transform-origin:center}
.ponto-in.novo{transform-origin:center}
.ponto .disco{fill:var(--surface);stroke:var(--cena-off);stroke-width:2;stroke-dasharray:3 3;transition:fill .35s ease var(--d,0ms),stroke .35s ease var(--d,0ms)}
.ponto .miolo{fill:var(--cena-off);transition:opacity .3s ease var(--d,0ms)}
.ponto .ok{fill:none;stroke:var(--ponto-ok);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .3s ease var(--d,0ms)}
.cena.ligada .ponto .disco{fill:var(--cena-on);stroke:var(--cena-on);stroke-dasharray:none}
.cena.ligada .ponto .miolo{opacity:0}
.cena.ligada .ponto .ok{opacity:1}
.cena.ligada .ponto-in{animation:estala .5s ease var(--d,0ms) both}
@keyframes estala{0%,100%{transform:none}50%{transform:scale(1.4)}}
.conta{font-size:.88rem;font-weight:700;color:var(--etiq);min-height:1.3em}
.palco.ligada .conta{color:var(--accent)}
.pontos{display:flex;flex-wrap:wrap;gap:6px}
.pt{display:inline-grid;border:1px dashed var(--cena-off);border-radius:4px;padding:4px 9px;font-size:.82rem;background:var(--surface);color:var(--fg-soft);transition:border-color .35s ease var(--d,0ms),background-color .35s ease var(--d,0ms),color .35s ease var(--d,0ms)}
.pt span{grid-area:1/1}
.pt .para{visibility:hidden}
.pt .para::before{content:"";display:inline-block;width:.5em;height:.26em;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin-right:.45em;vertical-align:.25em}
.palco.ligada .pt{border-style:solid;border-color:var(--sel);background:var(--sel);color:var(--sel-fg)}
.palco.ligada .pt .de{visibility:hidden;transition:visibility 0s linear var(--d,0ms)}
.palco.ligada .pt .para{visibility:visible;transition:visibility 0s linear var(--d,0ms)}
/* camada 3D (só com WebGL2 e sem "reduzir movimento"): a ilha toma o lugar da cena 2D e do Vivinho do palco
   (o Vivinho passa a ser o 3D, para nunca ter mais de 2 na tela); no PDF volta a cena 2D */
.cena3d{display:none;width:100%;height:clamp(240px,58vw,340px);touch-action:pan-y;cursor:grab}
.palco.tem-3d .cena3d{display:block}
.palco.tem-3d .cena,.palco.tem-3d .viv{display:none}

/* ---------- Perguntas ---------- */
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:clamp(20px,4vw,40px);box-shadow:var(--shadow);min-width:0;scroll-margin-top:12px}
.cartao.troca{animation:surge .35s ease}
.etiq{font-size:.85rem;font-weight:700;color:var(--etiq)}
.cartao h1{font-size:clamp(1.8rem,4.4vw,2.8rem);font-weight:700;color:var(--accent);margin-bottom:14px}
.lead{font-size:clamp(1.02rem,1.6vw,1.15rem);color:var(--fg-soft);max-width:56ch}
.cartao h2{font-size:clamp(1.35rem,2.8vw,1.85rem);font-weight:700;margin:6px 0 20px}
.campo + .campo{margin-top:24px}
.campo h3{font-size:1rem;font-weight:700;color:var(--fg-soft);margin-bottom:10px}
.opcoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px}
.op{min-height:58px;text-align:left;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:4px;background:var(--surface);cursor:pointer;font-weight:700;font-size:.97rem;line-height:1.3;transition:background-color .15s,border-color .15s,color .15s,transform .15s}
.op:hover{border-color:var(--accent)}
.op:active{transform:scale(.98)}
.op[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-fg)}
.aviso{min-height:1.4em;margin-top:12px;font-size:.9rem;font-weight:700;color:var(--etiq)}
.acoes{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;padding:13px 24px;border-radius:4px;background:var(--btn);color:var(--btn-fg);border:1.5px solid var(--btn);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn-out{background:transparent;color:var(--accent);border-color:currentColor}
.btn-out:hover{background:var(--surface-2);border-color:currentColor}
/* pulso do Vivinho em volta do botão principal do momento de conectar */
.btn-chama{animation:chama 1.8s ease-out infinite}
@keyframes chama{0%{box-shadow:0 0 0 0 rgba(235,60,125,.45)}100%{box-shadow:0 0 0 14px rgba(235,60,125,0)}}
.meta{font-size:.9rem;color:var(--fg-soft)}

/* ---------- Caso parecido ---------- */
.caso{margin-top:20px;border:1.5px solid var(--rosa);border-radius:8px;padding:18px}
.caso h2,.caso h3{font-size:clamp(1.2rem,2.4vw,1.5rem);margin:4px 0 4px}
.caso-num{font-size:clamp(2rem,5vw,2.8rem);font-weight:700;color:var(--accent);line-height:1.1;margin:6px 0 4px;transform-origin:0 50%}
.caso-perfil{margin-top:10px;color:var(--fg-soft);font-size:.92rem}
.caso-revela{margin-top:0;animation:revela .6s cubic-bezier(.2,.8,.3,1) both;transform-origin:50% 0}
@keyframes revela{from{opacity:0;transform:perspective(700px) rotateX(-60deg)}to{opacity:1;transform:none}}
.caso-revela .caso-num{animation:cresce .6s cubic-bezier(.2,.8,.3,1.4) .35s both}
@keyframes cresce{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* ---------- Resultado ---------- */
.frentes{display:grid;gap:14px}
.frente{border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.frente h3{font-size:1.15rem;margin:2px 0 6px}
.frente .resumo{color:var(--fg-soft)}
.motivos{margin-top:10px;display:grid;gap:6px}
.motivos li{position:relative;padding-left:18px}
.motivos li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--rosa)}
.recursos{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.recursos li{border:1px solid var(--line-strong);border-radius:4px;padding:3px 9px;font-size:.82rem}
.resumo-op{font-size:1rem;color:var(--fg-soft);margin:-10px 0 20px}
.bloco{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.bloco h3{font-size:1.25rem;margin-bottom:6px}
.bloco .resumo{color:var(--fg-soft);max-width:60ch}
.nota{font-size:.82rem;color:var(--fg-soft);margin-top:12px;max-width:70ch}
/* simulação do custo de integrar: premissas editáveis, conta na hora */
.sim-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.sim-campo{display:grid;gap:4px;align-content:end;font-size:.84rem;font-weight:700;color:var(--fg-soft)}
.sim-campo input{font:inherit;font-size:1rem;font-weight:700;color:var(--fg);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:4px;padding:10px 12px;width:100%}
.sim-campo input:focus{outline:2px solid var(--rosa);outline-offset:1px}
.sim-saida{margin-top:14px;padding:16px 18px;border-radius:8px;background:var(--surface-2)}
.sim-total{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:700;color:var(--accent);line-height:1.15}
.sim-det{color:var(--fg-soft);margin-top:4px}
/* prévia do AI Studio: o curso aparece sendo criado e termina num quiz */
.ai-tela{margin-top:14px;max-width:440px;border:1.5px solid var(--line-strong);border-radius:16px;padding:16px;background:var(--bg);min-height:220px;display:grid;gap:10px;align-content:start}
.ai-gerando{font-weight:700;color:var(--accent);display:grid;gap:8px}
.ai-barra{display:block;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;position:relative}
.ai-barra::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,var(--purpura),var(--rosa));border-radius:3px;animation:carrega 1.2s ease-in-out infinite}
@keyframes carrega{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.ai-formato{font-size:.78rem;font-weight:700;color:var(--etiq)}
.ai-curso{font-size:1.1rem}
.ai-mod{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:700;font-size:.94rem;animation:surge .35s ease both}
.ai-mod span{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sel);color:var(--sel-fg);font-size:.8rem}
.ai-quiz{display:grid;gap:8px;margin-top:4px;animation:surge .35s ease both}
.ai-perg{font-weight:700}
.ai-ops{display:grid;gap:6px}
.ai-op{text-align:left;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:4px;background:var(--surface);cursor:pointer;font-size:.92rem}
.ai-op:hover:not(:disabled){border-color:var(--accent)}
.ai-op:disabled{cursor:default}
.ai-op.certa{border-color:var(--sel);background:var(--sel);color:var(--sel-fg)}
.ai-op.errada{border-style:dashed;color:var(--fg-soft)}
.ai-fb{font-size:.9rem;font-weight:700;color:var(--accent);min-height:1.3em}
/* implantação */
.passos{display:grid;gap:8px;margin-top:12px;counter-reset:passo}
.passos li{counter-increment:passo;display:flex;gap:12px;align-items:baseline}
.passos li::before{content:counter(passo);flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;border:1.5px solid var(--accent);color:var(--accent);font-size:.8rem;font-weight:700}
/* chamada final: fala com o consultor que enviou o link (WhatsApp) ou copia o diagnóstico */
.chamada{margin-top:32px;border-radius:8px;padding:clamp(20px,4vw,32px);background:linear-gradient(135deg,#660099 0%,#380054 100%);color:#fff;display:grid;gap:10px}
.chamada h3{font-size:clamp(1.3rem,3vw,1.7rem)}
.chamada p{color:rgba(255,255,255,.92);max-width:56ch}
.chamada .acoes{margin-top:8px}
.btn-claro{background:#fff;color:#660099;border-color:#fff}
.btn-claro:hover{background:#F1E9F7;border-color:#F1E9F7}
.btn-borda{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.btn-borda:hover{background:rgba(255,255,255,.14);border-color:#fff}
.so-print{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--roxo);color:#fff;border-radius:8px;padding:12px 16px;font-size:.92rem;font-weight:700;box-shadow:0 18px 40px -18px rgba(0,0,0,.6);width:max-content;max-width:calc(100vw - 32px)}

/* ---------- Celular e desktop ---------- */
@media (max-width:599px){
  .marca-t small{display:none}
  .palco{padding:14px;gap:10px}
  .viv{width:60px;height:76px}
  .viv svg{width:40px}
  .pulso{width:64px;height:64px;margin:-32px 0 0 -32px}
  .fala{font-size:.95rem}
  .pontos{display:none}
  .palco.ligada .pontos{display:flex}
  .opcoes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .op{font-size:.92rem;padding:11px 12px}
}
@media (min-width:900px){
  .jogo{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start;gap:28px;padding-block:40px 72px}
  .palco{position:sticky;top:24px}
}
/* PDF do diagnóstico (Salvar em PDF): a operação conectada em cima e o diagnóstico embaixo, sem botões */
@media print{
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tema,.progresso,.toast,.acoes,.ai-ops,.ai-fb{display:none!important}
  .jogo{display:block;padding:0;max-width:none}

<script id="dados" type="application/json">{"jornada":{"titulo":"Como a plataforma pode ajudar a sua empresa?","abertura":"Responda algumas perguntas rápidas sobre a sua operação. No fim, você vê onde a plataforma entra, um caso parecido com o seu e o próximo passo.","duracao":"cerca de 2 minutos","falaAbertura":"Oi! Eu vou com você nessa. Em 2 minutos a gente descobre onde a plataforma entra na sua operação.","tituloResultado":"Onde a plataforma entra na sua operação","falaResultado":"Pronto. Olha o que eu encontrei na sua operação.","cenaVazia":"Sua operação vai aparecer aqui.","falaCaso":"Olha isso: conheço uma empresa bem parecida com a sua.","falaConectar":"Achei os pontos onde o treinamento não chega como deveria. Vamos ligar tudo?","tituloConectar":"Encontramos os pontos onde o treinamento não chega","textoConectar":"Cada ponto é um lugar da sua operação em que o treinamento chega tarde, chega pela metade ou não chega. Ligue a plataforma e veja o que muda.","falaConectada":"Pronto: a operação inteira no mesmo lugar, do jeito que ela é.","tituloConectada":"Tudo conectado","textoConectada":"Cada ponto agora tem uma frente da plataforma cuidando dele. No diagnóstico, você vê o porquê de cada uma e um caso parecido com o seu.","maxFrentes":4,"frentes":[{"id":"integracao","nome":"Integração rápida de quem chega","bloco":"Learning","resumo":"Trilha curta por cargo, com matrícula automática na admissão. A pessoa começa a produzir antes e o gestor vê quem já está pronto.","recursos":["Trilhas por cargo","Matrícula automática","Travas de avanço","Prova aleatória"]},{"id":"acesso","nome":"Treinamento para quem não tem mesa","bloco":"Acesso","resumo":"App com a marca da sua empresa, que funciona sem internet e não exige e-mail corporativo. Dá para entrar pelo celular, pelo tablet da unidade ou por QR code.","recursos":["App com a sua marca","Modo offline","Login sem e-mail corporativo","Acessibilidade em Libras","25 idiomas"]},{"id":"conhecimento","nome":"Resposta na hora, no ponto de uso","bloco":"Knowledge","resumo":"Procedimento, produto e política organizados e pesquisáveis, a um QR code de distância. A IA responde dúvidas usando só o material oficial da empresa.","recursos":["Base de conhecimento","QR code no ponto de execução","AI Companion","Histórico de versões"]},{"id":"comunicacao","nome":"Comunicado que chega e é lido","bloco":"Communication","resumo":"Campanha e mudança de procedimento publicadas uma vez e entregues à loja, ao cargo ou à região certa, com registro de quem viu e quando.","recursos":["Comunicado segmentado","Ciência com assinatura eletrônica","Notificações no app","Pesquisa e votação"]},{"id":"conteudoIA","nome":"Conteúdo pronto em minutos, com IA","bloco":"Intelligence","resumo":"O AI Studio transforma o material que você já tem em curso completo ou em vídeo de treinamento. A IA também cria as perguntas da avaliação.","recursos":["AI Studio","Vídeo a partir de um PDF","Perguntas Mágicas","Mais de 200 cursos prontos"]},{"id":"engajamento","nome":"Gente que quer treinar","bloco":"Engajamento","resumo":"Conteúdo curto em formato de feed, pontos, ranking e loja de recompensas. Lembretes automáticos trazem de volta quem ficou para trás.","recursos":["Feed no formato Reels","Gamificação","Loja de recompensas","Lembretes automáticos"]},{"id":"conformidade","nome":"Prova pronta para auditoria","bloco":"Learning","resumo":"Certificação e recertificação automáticas, assinatura eletrônica e histórico por data e por pessoa. O relatório que o auditor pede sai sem planilha paralela.","recursos":["Certificação e recertificação","Assinatura eletrônica","Checklist de campo","Relatório por data"]},{"id":"gestao","nome":"Gestão por dados, unidade por unidade","bloco":"Intelligence","resumo":"Painel com conclusão, nota e evolução por loja, regional, turno ou cargo. O gestor pergunta à IA em linguagem natural e recebe a resposta com o relatório.","recursos":["Painel do gestor","Insights com IA","Relatórios analíticos","Matr <script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('dados').textContent);
var J = D.jornada || {};
var ETAPAS = J.etapas || [];
/* etapas da página: -1 abertura, 0..n-1 perguntas, n conectar a plataforma, n+1 resultado */
var CONECTAR = ETAPAS.length, FIM = ETAPAS.length + 1;
var byId = function(id){ return document.getElementById(id) || document.createElement('div'); };
var $$ = function(sel, el){ return Array.prototype.slice.call((el||document).querySelectorAll(sel)); };
function h(tag, a, kids){
  var el = document.createElement(tag);
  if(a){ for(var k in a){ var v = a[k]; if(v == null || v === false) continue;
    if(k === 'text') el.textContent = v;
    else if(k === 'class') el.className = v;
    else if(k.slice(0,2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v); } }
  (kids||[]).forEach(function(c){ if(c == null || c === false) return; el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
}
function uniq(arr){ var o=[]; arr.forEach(function(x){ if(x && o.indexOf(x) < 0) o.push(x); }); return o; }
var store = {
  get: function(k, d){ try{ var v = localStorage.getItem('pbvivo:'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem('pbvivo:'+k, JSON.stringify(v)); }catch(e){} }
};
var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var toastT;
function toast(msg){ var t = byId('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 2800); }
function copia(texto, ok){
  function alternativa(){
    var ta = h('textarea', {style:'position:fixed;opacity:0'}); ta.value = texto; document.body.appendChild(ta); ta.select();
    var foi = false; try{ foi = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); toast(foi ? ok : 'Não deu para copiar. Selecione o texto e use Ctrl+C.');
  }
  try{ navigator.clipboard.writeText(texto).then(function(){ toast(ok); }, alternativa); }catch(e){ alternativa(); }
}

/* ---------- Estado: respostas, etapa, caso já mostrado e operação conectada, guardados no aparelho para retomar ---------- */
/* R: {campo: id da opção ou lista de ids}; cv: índice do caso mostrado no caminho (-1 = nenhum) */
var salvo = store.get('jornada', null) || {};
var R = salvo.r && typeof salvo.r === 'object' ? salvo.r : {};
var etapa = typeof salvo.e === 'number' && salvo.e >= -1 && salvo.e <= FIM ? salvo.e : -1;
var cv = typeof salvo.cv === 'number' ? salvo.cv : -1;
var ligada = !!salvo.l && etapa >= CONECTAR;
var reacao = '', focar = false, avanco, ligando;
function salva(){ store.set('jornada', {r:R, e:etapa, cv:cv, l:ligada}); }

/* ---------- Link: contato do GN e resultado compartilhado ---------- */
/* o GN envia /descubra/#gn=Nome&w=55DDDNUMERO (depois do #, nada vai ao servidor); "Enviar para o meu time" acrescenta r=<respostas> */
function lerHash(){
  var o = {};
  (location.hash || '').replace(/^#/, '').split('&').forEach(function(par){
    var i = par.indexOf('=');
    if(i > 0){ try{ o[par.slice(0, i)] = decodeURIComponent(par.slice(i + 1)); }catch(e){} }
  });
  return o;
}
var HASH = lerHash();
var GN = HASH.w ? {nome:String(HASH.gn || '').slice(0, 60), zap:HASH.w.replace(/\D/g, '').slice(0, 15)} : store.get('jornadaGN', null);
if(HASH.w) store.set('jornadaGN', GN);
if(HASH.r){
  try{ var compartilhado = JSON.parse(atob(HASH.r)); if(compartilhado && typeof compartilhado === 'object'){ R = compartilhado; etapa = FIM; ligada = true; cv = -1; salva(); } }catch(e){}
  /* tira as respostas do endereço para "Refazer" não voltar ao resultado ao recarregar */
  if(window.history && history.replaceState) history.replaceState(null, '', location.pathname + location.search + (GN && GN.zap ? '#' + contatoNoLink().join('&') : ''));
}
function contatoNoLink(){ return GN && GN.zap ? (GN.nome ? ['gn=' + encodeURIComponent(GN.nome)] : []).concat(['w=' + GN.zap]) : []; }
function linkResultado(){
  var p = contatoNoLink();
  try{ p.push('r=' + encodeURIComponent(btoa(JSON.stringify(R)))); }catch(e){}
  return location.href.split('#')[0] + '#' + p.join('&');
}
function campos(){ var lista = []; ETAPAS.forEach(function(e){ (e.campos||[]).forEach(function(c){ lista.push(c); }); }); return lista; }
function escolhidas(c){ var ids = [].concat(R[c.id] == null ? [] : R[c.id]); return (c.opcoes||[]).filter(function(o){ return ids.indexOf(o.id) >= 0; }); }
function opcoesEscolhidas(){ var lista = []; campos().forEach(function(c){ lista = lista.concat(escolhidas(c)); }); return lista; }
function completa(e){ return (e.campos||[]).every(function(c){ return escolhidas(c).length > 0; }); }
function soUmaEscolha(e){ return (e.campos||[]).every(function(c){ return c.tipo !== 'varios'; }); }

/* ---------- Motor: pontos por frente, motivos, sinais e caso parecido ---------- */
/* o caso aparece no meio da jornada quando bate forte (o segmento vale 3, mais um sinal) e no resultado com qualquer par de sinais */
var NOTA_NO_CAMINHO = 4, NOTA_NO_RESULTADO = 2;
function sinais(){ var sin = {}; opcoesEscolhidas().forEach(function(o){ (o.sinais || []).forEach(function(x){ sin[x] = true; }); }); return sin; }
function diagnostico(){
  var pts = {}, mot = {};
  opcoesEscolhidas().forEach(function(o){
    var k;
    for(k in (o.pesos || {})) pts[k] = (pts[k] || 0) + o.pesos[k];
    for(k in (o.motivos || {})) (mot[k] = mot[k] || []).push(o.motivos[k]);
  });
  var frentes = (J.frentes || []).map(function(f, i){ return {f:f, p:pts[f.id] || 0, i:i, m:uniq(mot[f.id] || [])}; })
    .filter(function(x){ return x.p > 0; })
    .sort(function(a, b){ return b.p - a.p || a.i - b.i; });
  var m = melhorCaso(sinais());
  return {frentes:frentes, caso:m && m.nota >= NOTA_NO_RESULTADO ? D.casos[m.i] : null};
}
function melhorCaso(sin){
  var melhor = null;
  (J.casos || []).forEach(function(j){
    var n = 0, x;
    for(x in (j.sinais || {})) if(sin[x]) n += j.sinais[x];
    if(D.casos && D.casos[j.caso] && n > (melhor ? melhor.nota : 0)) melhor = {i:j.caso, nota:n};
  });
  return melhor;
}
function pontosAtivos(){ var sin = sinais(); return (J.pontos || []).filter(function(p){ return sin[p.sinal]; }); }

/* ---------- Palco: Vivinho e fala ---------- */
function fala(txt){ var f = byId('fala'); f.textContent = txt; f.classList.remove('nova'); void f.offsetWidth; f.classList.add('nova'); }
function reage(){ var v = byId('viv'); v.classList.remove('reage'); void v.offsetWidth; v.classList.add('reage'); }
function progresso(){ var n = ETAPAS.length || 1; byId('barra').style.width = Math.round(Math.max(0, Math.min(etapa, n)) / n * 100) + '%'; }

/* ---------- Cena: a operação do visitante, montada a cada resposta ---------- */
/* cada opção traz em "cena" o que acrescenta: predio:<símbolo>, unidades:<n>, pessoa, van, escritorio, franquia, globo, chegando, aparelho:<símbolo> */
var SVGNS = 'http://www.w3.org/2000/svg', XLINK = 'http://www.w3.org/1999/xlink';
var DURACAO = 2400; /* ms da Fibra atravessando a cena no momento de conectar */
var vistos = {}, pontoEls = {};
function svg(tag, a){ var el = document.createElementNS(SVGNS, tag); for(var k in a){ if(a[k] != null) el.setAttribute(k, a[k]); } return el; }
function usa(simbolo, x, y, larg, alt, cls){

  u.setAttribute('href', '#g-' + simbolo); u.setAttributeNS(XLINK, 'xlink:href', '#g-' + simbolo);
  return u;
}
function grupo(cls, filho){ var g = svg('g', {'class':cls}); g.appendChild(filho); return g; }
function colunas(n){ var xs = [], passo = 340 / Math.max(1, n); for(var k = 0; k < n; k++) xs.push(Math.round(30 + passo * (k + .5))); return xs; }
function tokensCena(){
  var t = {pessoa:0};
  opcoesEscolhidas().forEach(function(o){ (o.cena || []).forEach(function(k){
    var p = k.split(':');
    if(p.length > 1) t[p[0]] = p[1]; else t[k] = (t[k] || 0) + 1;
  }); });

}
function cena(){
  var t = tokensCena(), novos = {}, lista = [];
  /* elemento que não estava na cena antes brota; o resto fica parado */
  function poe(chave, el){
    var alvo = el.tagName === 'g' ? el.firstChild : el;
    if(!vistos[chave]) alvo.setAttribute('class', alvo.getAttribute('class') + ' novo');
    novos[chave] = true; lista.push(el);
  }
  if(t.predio){
    var escritorio = t.escritorio && t.predio !== 'torre';
    var n = Math.max(1, Math.min(5, +t.unidades || 1)), xs = colunas(n + (escritorio ? 1 : 0));
    xs.slice(0, n).forEach(function(x, k){
      poe('predio' + k + t.predio, usa(t.predio, x - 28, 115, 56, 61));
      if(t.franquia && n > 1 && (k === 0 || k === n - 1)) poe('bandeira' + k, usa('bandeira', x + 8, 100, 16, 16, 'alt'));
    });
    if(escritorio) poe('escritorio', usa('torre', xs[n] - 28, 115, 56, 61));
  }
  if(t.globo) poe('globo', usa('globo', 8, 6, 28, 28));
  colunas(Math.min(6, t.pessoa)).slice(0, Math.min(6, t.pessoa)).forEach(function(x, k){
    var dx = k % 2 ? 10 : -10;
    poe('pessoa' + k, usa('pessoa', x - 7 + dx, 172, 14, 26, k % 2 ? 'alt' : ''));
    if(t.aparelho) poe('aparelho' + k + t.aparelho, usa(t.aparelho, x + 2 + dx, 182, 9, 12));
  });
  if(t.chegando) poe('chegando', grupo('chega', usa('pessoa', 4, 172, 14, 26, 'alt')));
  if(t.van) poe('van', grupo('anda', usa('van', 0, 197, 38, 22, 'alt')));
  var g = byId('cenaEls'); g.textContent = '';
  lista.forEach(function(el){ g.appendChild(el); });

}
/* ponte para a camada 3D (script type="module" no fim da página): o motor fica aqui; o 3D só lê o estado e desenha */
window.jornadaEstado = function(){
  return {tokens:tokensCena(), pontos:pontosAtivos().map(function(p){ return p.sinal; }), ligada:ligada, duracao:DURACAO};
};
function avisa3d(tipo){ try{ document.dispatchEvent(new CustomEvent('jornada:' + tipo)); }catch(e){} }
/* pontos desconectados: distribuídos ao longo da Fibra, na ordem em que acendem */
function desenhaPontos(){
  var ps = pontosAtivos(), g = byId('pontosCena'), fibra = byId('fibra'), vivos = {};
  var L = fibra.getTotalLength ? fibra.getTotalLength() : 0, ul = byId('pontos');
  ps.forEach(function(p, i){
    var t = (i + 1) / (ps.length + 1), pt = L ? fibra.getPointAtLength(L * t) : {x:20 + 360 * t, y:60};
    var el = pontoEls[p.sinal], novo = !el;
    if(novo){
      el = svg('g', {'class':'ponto'});
      var dentro = svg('g', {'class':'ponto-in novo'});
      dentro.appendChild(svg('circle', {'class':'disco', r:11}));
      dentro.appendChild(svg('circle', {'class':'miolo', r:2.6}));
      dentro.appendChild(svg('path', {'class':'ok', d:'M-4.6 .4l3.1 3.1 6.1-6.6'}));
      el.appendChild(dentro); pontoEls[p.sinal] = el;
    } else el.firstChild.setAttribute('class', 'ponto-in');
    el.style.transform = 'translate(' + pt.x.toFixed(1) + 'px,' + pt.y.toFixed(1) + 'px)';
    el.style.setProperty('--d', Math.round(t * DURACAO) + 'ms');
    if(novo) g.appendChild(el);
    vivos[p.sinal] = true;
  });
  for(var k in pontoEls){ if(!vivos[k]){ g.removeChild(pontoEls[k]); delete pontoEls[k]; } }
  ul.textContent = '';
  ps.forEach(function(p, i){
    var li = h('li', {class:'pt'}, [h('span', {class:'de', text:p.rotulo}), h('span', {class:'para', text:p.resolvido})]);
    li.style.setProperty('--d', Math.round((i + 1) / (ps.length + 1) * DURACAO) + 'ms');
    ul.appendChild(li);
  });
}
function conta(){
  var n = pontosAtivos().length, algo = opcoesEscolhidas().length > 0;
  byId('conta').textContent = !algo ? (J.cenaVazia || '') : !n ? '' :
    n + (n === 1 ? ' ponto ' : ' pontos ') + (ligada ? (n === 1 ? 'conectado' : 'conectados') : (n === 1 ? 'desconectado' : 'desconectados'));
}
/* a Fibra atravessa a cena da esquerda para a direita e cada elemento acende quando ela passa */
function acende(animado){
  var cn = byId('cena'), fibra = byId('fibra'), L = fibra.getTotalLength ? fibra.getTotalLength() : 0;
  $$('.el', cn).forEach(function(el){ el.style.setProperty('--d', animado ? Math.round(+el.getAttribute('data-x') / 400 * DURACAO) + 'ms' : '0ms'); });
  if(!animado) $$('.ponto, .pt').forEach(function(el){ el.style.setProperty('--d', '0ms'); });
  fibra.style.strokeDasharray = String(L);
  fibra.style.transition = animado && !reduced ? 'stroke-dashoffset ' + DURACAO + 'ms linear' : 'none';
  fibra.style.strokeDashoffset = '0';
  cn.classList.add('ligada'); byId('palco').classList.add('ligada');
  /* animado, o contador só vira "conectados" quando a Fibra termina de passar (no fim de conectar) */
  if(animado){ var v = byId('viv'); v.classList.remove('forte'); void v.offsetWidth; v.classList.add('forte'); avisa3d('liga'); }
  else conta();
}
function apaga(){
  var fibra = byId('fibra'), L = fibra.getTotalLength ? fibra.getTotalLength() : 0;
  fibra.style.transition = 'none'; fibra.style.strokeDasharray = String(L); fibra.style.strokeDashoffset = String(L);
  byId('cena').classList.remove('ligada'); byId('palco').classList.remove('ligada'); byId('viv').classList.remove('forte');
  conta();

/* ---------- Perguntas ---------- */
var cartao = byId('cartao');
function troca(nos){

}
function foca(el){ el.setAttribute('tabindex', '-1'); try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); } }
function vai(i, casoAntes){
  clearTimeout(avanco); clearTimeout(ligando); ligando = null;

/* depois de cada pergunta: mostra o caso parecido uma vez, quando ele bate forte; sem ponto desconectado, pula o conectar */
function avanca(i){
  var prox = i + 1, m = prox < CONECTAR && cv < 0 ? melhorCaso(sinais()) : null;
  if(m && m.nota >= NOTA_NO_CAMINHO){ cv = m.i; vai(prox, D.casos[m.i]); return; }

    ])]);

}

  });

/* escolha única avança sozinha quando a etapa fica completa; com reação do Vivinho, espera um pouco para dar tempo de ler */

  aviso.textContent = '';

    var sel = escolhidas(c).map(function(x){ return x.id; }), k = sel.indexOf(o.id);
    if(k >= 0) sel.splice(k, 1);

    else sel.push(o.id);

  } else R[c.id] = o.id;
  marca(c, bts); salva(); cena(); reage();
  if(o.fala && [].concat(R[c.id]).indexOf(o.id) >= 0){ reacao = o.fala; fala(o.fala); }

/* ---------- Conectar a plataforma ---------- */

/* ---------- Resultado ---------- */
function escolhidasDe(id){ var r = []; campos().forEach(function(c){ if(c.id === id) r = r.concat(escolhidas(c)); }); return r; }
function resumoOperacao(){

}
function milhar(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
/* texto que sai da página (WhatsApp do consultor ou cópia): a operação, as frentes, os pontos, o caso e o link do diagnóstico */
function textoDiagnostico(d){
  var M = J.mensagem || {}, pub = escolhidasDe('publico'), ps = pontosAtivos();

}
function simulacao(){
  var S = J.simulacao, rot = escolhidasDe('rotatividade')[0], pes = escolhidasDe('pessoas')[0];
  if(!S || !rot || !(rot.valor >= .3)) return null;
  var entradas = [
    {rotulo:'Pessoas na operação', valor:pes ? pes.valor : 1000},
    {rotulo:'Rotatividade por ano (%)', valor:Math.round(rot.valor * 100)},
    {rotulo:'Dias a menos de integração', valor:S.dias},
    {rotulo:'Custo de um dia de trabalho (R$)', valor:S.custoDia}
  ];

    var adm = num(0) * num(1) / 100, dias = adm * num(2);
    total.textContent = 'R$ ' + milhar(dias * num(3)) + ' por ano';

  }

/* prévia do AI Studio: o curso de exemplo do segmento aparece sendo criado quando o bloco entra na tela, e termina num quiz */
function previaAIStudio(){
  var A = J.aiStudio || {}, seg = escolhidasDe('segmento')[0], mod = (A.modelos || {})[seg && seg.id] || (A.modelos || {}).padrao;
  if(!mod) return null;

  var bloco = h('section', {class:'bloco'}, [h('h3', {text:A.titulo}), h('p', {class:'resumo', text:A.texto}), tela, h('p', {class:'nota', text:A.rotulo})]);
  function quiz(){
    var ops = mod.opcoes.map(function(t, i){ return {t:t, certa:i === 0}; });
    for(var i = ops.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), x = ops[i]; ops[i] = ops[j]; ops[j] = x; }
    var fb = h('p', {class:'ai-fb', 'aria-live':'polite'}), bts = [];
    ops.forEach(function(o){
      var b = h('button', {type:'button', class:'ai-op', text:o.t, onclick:function(){
        bts.forEach(function(x, k){ x.disabled = true; if(ops[k].certa) x.classList.add('certa'); });
        if(!o.certa) b.classList.add('errada');
        fb.textContent = o.certa ? A.certo : A.errado;
      }});
      bts.push(b);
    });
    tela.appendChild(h('div', {class:'ai-quiz'}, [h('p', {class:'ai-perg', text:mod.pergunta}), h('div', {class:'ai-ops'}, bts), fb]));
  }
  var passos = [function(){ tela.textContent = ''; tela.appendChild(h('p', {class:'ai-formato', text:A.formato})); tela.appendChild(h('h4', {class:'ai-curso', text:mod.curso})); }]
    .concat(mod.modulos.map(function(t, i){ return function(){ tela.appendChild(h('p', {class:'ai-mod'}, [h('span', {text:String(i + 1)}), t])); }; }), [quiz]);

    passos.forEach(function(p, i){ setTimeout(p, 1500 + i * 450); });
  }

  } else roda();

}

function resultado(){

    camera.lookAt(foco);
    const pp = (ms - pulo) / 450;
    viv.position.y = VIV_Y + Math.sin(ms / 600) * .07 + (pp < 1 ? Math.sin(Math.PI * pp) * .35 : 0);
    viv.rotation.y = Math.atan2(camera.position.x - viv.position.x, camera.position.z - viv.position.z) + Math.sin(ms / 900) * .1;
    const pF = liga ? limita((ms - liga.t0) / liga.d, 0, 1) : (estado.ligada ? 1 : 0);
    els.forEach(e => {
      e.obj.scale.setScalar(ESCALA * salto(limita((ms - e.nasc) / 550, 0, 1)));
      if(e.mover) e.mover(e, ms); else e.obj.position.lerp(e.alvo, Math.min(1, dt * 6));
      if(liga && pF >= e.t) e.quer = 1;
      e.luz += (e.quer - e.luz) * Math.min(1, dt * 7); tinge(e.m, e.luz);
    });
    pontosEls.forEach(p => {
      p.obj.position.lerp(p.alvo, Math.min(1, dt * 6));
      if(liga && pF >= p.t) p.quer = 1;
      p.luz += (p.quer - p.luz) * Math.min(1, dt * 8);
      p.obj.material.color.lerpColors(P.acentoOff, P.acentoOn, p.luz);
      p.obj.material.emissive.copy(P.acentoOn).multiplyScalar(.3 * p.luz);
      const estalo = p.quer && p.luz < .97 ? 1 + .6 * Math.sin(Math.PI * p.luz) : 1;
      p.obj.scale.setScalar(salto(limita((ms - p.nasc) / 500, 0, 1)) * estalo);
    });
    fibra.geometry.setDrawRange(0, Math.floor(TOTAL * pF / 3) * 3);
    guiaMat.color.copy(P.acentoOff); guiaMat.opacity = .55 * (1 - pF);
    aneis.forEach((r, k) => {
      const p = liga ? (ms - liga.t0 - k * 350) / 1700 : -1;
      r.material.opacity = p > 0 && p < 1 ? .8 * (1 - p) : 0; r.scale.setScalar(.4 + Math.max(0, p) * 6.5);
    });
    if(liga && ms - liga.t0 > liga.d + 1800) liga = null;
    if(vizinha){
      vizinha.g.scale.setScalar(salto(limita((ms - vizinha.nasc) / 700, 0, 1)) * .9);
      vizinha.g.position.y = VIZ.y + Math.sin(ms / 1100) * .12; tinge(vizinha.m, 1);
    }
    renderer.render(cena, camera);
    pede();
  }

  /* tamanho, tema, arrastar para girar, visibilidade */
  new ResizeObserver(() => {
    const w = canvas.clientWidth, h = canvas.clientHeight; if(!ativo || !w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    distBase = 12 * Math.max(1, 1.45 / camera.aspect); pede();
  }).observe(canvas);
  new MutationObserver(lePaleta).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
  canvas.addEventListener('pointerdown', e => { arrasto = e.clientX; try{ canvas.setPointerCapture(e.pointerId); }catch(x){} });
  canvas.addEventListener('pointermove', e => { if(arrasto === null) return; ang -= (e.clientX - arrasto) * .008; arrasto = e.clientX; });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => canvas.addEventListener(n, () => { arrasto = null; }));
  canvas.addEventListener('webglcontextlost', desliga);
  new IntersectionObserver(es => { visivel = es[0].isIntersecting; pede(); }).observe(canvas);
  document.addEventListener('visibilitychange', pede);

  /* eventos do motor */
  document.addEventListener('jornada:cena', () => { sincroniza(); pulo = performance.now(); });
  document.addEventListener('jornada:liga', () => {
    estado = window.jornadaEstado(); liga = {t0:performance.now(), d:estado.duracao || 2400}; pulo = liga.t0;
    els.forEach(e => { e.quer = 0; }); pontosEls.forEach(p => { p.quer = 0; }); pede();
  });
  document.addEventListener('jornada:caso', () => { if(!vizinha) criaVizinha(); voo = {t0:performance.now()}; pulo = voo.t0; pede(); });
  sincroniza();
})();
</script>
